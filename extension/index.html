<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>我的新标签页</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <main class="personal-shell">
    <aside class="tab-sidebar" aria-labelledby="openTabsSectionTitle">
      <header class="sidebar-header">
        <div>
          <p class="eyebrow">OPEN NOW</p>
          <div class="sidebar-title-line">
            <h1 id="openTabsSectionTitle">已打开</h1>
            <span class="tab-total" id="statTabs">0</span>
          </div>
        </div>
        <button class="round-button" id="refreshTabs" type="button" title="刷新标签页" aria-label="刷新标签页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
        </button>
      </header>
      <label class="tab-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="tabSearch" type="search" placeholder="搜索标签页" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
        <div class="tab-cleanup-text">检测到 <strong id="tabOutDupeCount"></strong> 个新标签页</div>
        <button class="text-button" data-action="close-tabout-dupes">关闭多余项</button>
      </div>
      <section class="active-section" id="openTabsSection" style="display:none">
        <div class="sidebar-subhead"><span id="openTabsSectionCount"></span></div>
        <div class="missions" id="openTabsMissions"></div>
      </section>
      <footer class="sidebar-footer">
        <span><i class="status-dot"></i> 实时同步</span>
        <span>点击即可返回</span>
      </footer>
    </aside>

    <section class="home-panel" aria-labelledby="greeting">
      <header class="home-hero">
        <div class="hero-copy">
          <p class="eyebrow" id="dateDisplay">TODAY</p>
          <h2 id="greeting">今天好</h2>
          <p class="hero-subtitle">从这里开始。</p>
        </div>
        <div class="hero-actions">
          <div class="clock" aria-label="当前时间">
            <span id="clockTime">00:00</span>
            <small id="clockWeekday">FRI</small>
          </div>
          <button class="edit-button" id="toggleQuickEdit" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
            <span>编辑入口</span>
          </button>
        </div>
      </header>
      <div class="double-rule" aria-hidden="true"><span></span></div>
      <form class="web-search" id="webSearchForm" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="webSearchInput" type="search" placeholder="直接键入，使用默认搜索引擎搜索" autocomplete="off" enterkeyhint="search" aria-label="搜索网页" autofocus>
        <kbd>Enter</kbd>
      </form>
      <div class="quick-grid" id="quickLinksGrid"></div>

      <section class="deferred-column" id="deferredColumn" style="display:none">
        <div class="section-header">
          <h3>稍后阅读</h3>
          <div class="section-line"></div>
          <div class="section-count" id="deferredCount"></div>
        </div>
        <div class="deferred-list" id="deferredList"></div>
        <div class="deferred-empty" id="deferredEmpty" style="display:none">暂时没有保存的标签页。</div>
        <div class="deferred-archive" id="deferredArchive" style="display:none">
          <button class="archive-toggle" id="archiveToggle">
            <svg class="archive-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
            归档 <span class="archive-count" id="archiveCount"></span>
          </button>
          <div class="archive-body" id="archiveBody" style="display:none">
            <input type="search" class="archive-search" id="archiveSearch" placeholder="搜索已归档标签页">
            <div class="archive-list" id="archiveList"></div>
          </div>
        </div>
      </section>

      <footer class="page-footer">
        <p><strong>MY START PAGE</strong> · 数据仅保存在本机</p>
        <p>Based on <a href="https://github.com/zarazhangrui/tab-out" target="_blank" rel="noopener">Tab Out</a> · MIT</p>
      </footer>
    </section>
  </main>

  <dialog class="link-dialog" id="linkDialog">
    <form method="dialog" id="linkForm">
      <div class="dialog-header">
        <div><p class="eyebrow">QUICK LINK</p><h3 id="linkDialogTitle">添加入口</h3></div>
        <button class="round-button dialog-close" value="cancel" type="submit" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <input id="linkId" type="hidden">
      <label><span>名称</span><input id="linkName" required maxlength="24" placeholder="例如：学校图书馆"></label>
      <label><span>网址</span><input id="linkUrl" required inputmode="url" placeholder="https://example.com"></label>
      <label><span>分组</span><select id="linkCategory" required></select></label>
      <p class="form-error" id="linkFormError" role="alert"></p>
      <div class="dialog-actions">
        <button class="button-secondary" value="cancel" type="submit">取消</button>
        <button class="button-primary" value="default" type="submit">保存入口</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
    <span id="toastText"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
